# PR 검사 — main 으로 가는 PR 마다 앱과 Supabase 검사를 자동으로 돌린다.
#
# 왜: 2026-11-15 에 앱(익산시만 남기기 · 새 혜택 · 검수 배지)과 Supabase(원문 · 검수 기록) 작업을
# 여러 PR 로 나눠 올렸다. 그 사이 main 이 바뀌면 합친 결과가 깨질 수 있다. GitHub 은 PR 을
# main 에 '합친 상태'로 이 검사를 돌리므로, 겹쳐서 깨지면 합치기 전에 빨간불이 뜬다.
# 자세한 순서와 주의: docs/기획/2026-11-15-합치기-순서와-주의.md
#
# 이 검사를 '통과해야 합칠 수 있게' 하려면 저장소 관리자가 Settings → Branches(또는 Rules) 에서
# main 의 필수 상태 검사(required status checks)로 아래 작업들을 지정한다.
#
# 작업마다 GitHub 이 빈 가상 컴퓨터를 한 대씩 빌려 동시에 돌린다. 전체 시간은 가장 느린 작업이 정한다.
# 11/20: 앱 검사를 [타입 · 테스트]와 [빌드] 두 대로 나눴다(예전엔 한 대가 차례로 — 2분 35초). 테스트는
# 검사 컴퓨터에서만 파일을 동시에 돌린다(apps/web/vitest.config.mts). 공개 저장소라 대수가 늘어도 비용이 없다.

name: PR 검사

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch: # 손으로도 돌릴 수 있게

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 앱 — 타입 · 테스트
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" # 화면 캡처 스크립트용이라 검사에는 브라우저가 필요 없다
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: 타입 검사
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: 테스트 (파일 동시 실행 — CI=true)
        run: node node_modules/vitest/vitest.mjs run

  web-build:
    name: 앱 — 빌드
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: 빌드
        run: node node_modules/next/dist/bin/next build

  supabase:
    name: Supabase — 설계 · seed · 원문 검사
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: supabase/tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: supabase/tests/package-lock.json
      - run: npm ci
      - name: 표 설계 (현재 앱 데이터로 넣어 보기)
        run: node redesign.test.mjs
      - name: seed (11/12 보관본 기준)
        run: node seed.test.mjs
      - name: API 원문 (11/12)
        run: node raw.test.mjs
      - name: 공고문 원문 (11/14)
        run: node notice.test.mjs
      - name: 앱 공개 정책 함수 (11/16)
        run: node app-policies.test.mjs
      - name: 앱 JSON → DB 이관 (11/16)
        run: node app-fields.test.mjs
      - name: 정책 서류 목록 (11/17)
        run: node documents.test.mjs
      - name: 정책이 바뀌면 다시 빌드 (11/17)
        run: node app-rebuild.test.mjs
      - name: 정책 종류 아이콘 (11/20)
        run: node policy-icon.test.mjs
      - name: 처음 올라온 때 (11/20)
        run: node policy-published-at.test.mjs

  api-infra:
    name: AWS — api · infra 검사 · 묶기
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            infra/package-lock.json
      - name: 설치
        run: |
          (cd apps/api && npm ci)
          (cd infra && npm ci)
      - name: api — 타입 · 테스트
        working-directory: apps/api
        run: |
          node node_modules/typescript/bin/tsc --noEmit
          node node_modules/vitest/vitest.mjs run
      - name: infra — 타입 · 테스트 · 묶기(cdk synth, AWS 연결 없음)
        working-directory: infra
        run: |
          node node_modules/typescript/bin/tsc --noEmit
          node node_modules/vitest/vitest.mjs run
          npx cdk synth --quiet
